services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnia
      POSTGRES_PASSWORD: omnia
      POSTGRES_DB: omnia
    ports:
      - "5432:5432"
    volumes:
      - omnia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnia -d omnia"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://omnia:omnia@postgres:5432/omnia
      OMNIA_API_HOST: 0.0.0.0
      OMNIA_API_PORT: 8080
      RUST_LOG: omnia_api=debug,omnia_db=debug,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_OMNIA_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  omnia_postgres:
