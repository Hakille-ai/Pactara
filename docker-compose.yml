services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactara
      POSTGRES_PASSWORD: pactara
      POSTGRES_DB: pactara
    ports:
      - "5432:5432"
    volumes:
      - pactara_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactara -d pactara"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://pactara:pactara@postgres:5432/pactara
      PACTARA_API_HOST: 0.0.0.0
      PACTARA_API_PORT: 8080
      PACTARA_AUTH_REQUIRED: "false"
      PACTARA_DEV_CUSTODY_ENABLED: "true"
      PACTARA_DEV_SESSIONS_ENABLED: "true"
      PACTARA_CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001
      RUST_LOG: pactara_api=debug,pactara_db=debug,tower_http=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PACTARA_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_PACTARA_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pactara_postgres:
