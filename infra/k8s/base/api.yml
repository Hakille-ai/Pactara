apiVersion: apps/v1
kind: Deployment
metadata:
  name: pactara-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pactara-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pactara-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-owner/your-repo/pactara-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pactara-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pactara-postgres
                  key: database-url
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: pactara-api
spec:
  selector:
    app.kubernetes.io/name: pactara-api
  ports:
    - name: http
      port: 8080
      targetPort: http
