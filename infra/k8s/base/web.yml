apiVersion: apps/v1
kind: Deployment
metadata:
  name: pactara-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pactara-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pactara-web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-owner/your-repo/pactara-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_PACTARA_API_URL
              valueFrom:
                configMapKeyRef:
                  name: pactara-config
                  key: NEXT_PUBLIC_PACTARA_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: pactara-web
spec:
  selector:
    app.kubernetes.io/name: pactara-web
  ports:
    - name: http
      port: 3000
      targetPort: http
