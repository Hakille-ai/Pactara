apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pactara

resources:
  - ../../base

images:
  - name: ghcr.io/your-owner/your-repo/pactara-api
    newName: ghcr.io/your-owner/your-repo/pactara-api
    newTag: latest
  - name: ghcr.io/your-owner/your-repo/pactara-web
    newName: ghcr.io/your-owner/your-repo/pactara-web
    newTag: latest

configMapGenerator:
  - name: pactara-config
    behavior: merge
    literals:
      - PACTARA_AUTH_REQUIRED=true
      - PACTARA_DEV_CUSTODY_ENABLED=false
      - PACTARA_DEV_SESSIONS_ENABLED=false
      - PACTARA_CORS_ALLOW_ORIGINS=https://app.pactara.local
      - RUST_LOG=pactara_api=info,pactara_db=info,tower_http=info
      - NEXT_PUBLIC_PACTARA_API_URL=https://api.pactara.local
